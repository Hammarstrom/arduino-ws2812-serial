; PlatformIO Project Configuration File
;
; Build & upload:
;   pio run -e uno          (compile for Arduino Uno/Nano)
;   pio run -e esp32dev     (compile for ESP32)
;   pio run -e esp32dev -t upload    (flash ESP32)
;   pio device monitor      (open serial monitor)

[platformio]
src_dir = .
default_envs = esp32dev

[env]
framework = arduino
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
monitor_speed = 9600

[env:uno]
platform = atmelavr
board = uno

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
    -DESP32_BOARD
